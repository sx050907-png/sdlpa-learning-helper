name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --prefix work/test-env
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: edge-store-package
          path: |
            outputs/Edge*/*.zip
            outputs/Edge*/*.sha256
